[package]
name = "yazelix_cursors"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Standalone Yazelix cursor presets and terminal shader outputs"
license = "Apache-2.0"
repository = "https://github.com/Yazelix/cursors"
readme = "README.md"
keywords = ["cursor", "ghostty", "terminal", "yazelix"]
categories = ["command-line-utilities"]

[[bin]]
name = "yzc"
path = "src/bin/yzc.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
